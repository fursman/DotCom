<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We can make anything</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦾</text></svg>">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #curtain { position: fixed; inset: 0; background: #000; pointer-events: none; transition: opacity 2.5s ease; z-index: 2; }
    #curtain.gone { opacity: 0; }
    #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #aaa; font: 16px monospace; z-index: 3; }
    #nogl a { color: #fff; }
  </style>
</head>
<body>
  <div id="curtain"></div>
  <div id="nogl">This one needs WebGL2. <a href="/">Back to the ducks</a></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

    // ------------------------------------------------------------------
    //  Setup & quality
    // ------------------------------------------------------------------
    const params = new URLSearchParams(location.search);
    const probe = document.createElement('canvas').getContext('webgl2');
    if (!probe) { document.getElementById('nogl').style.display = 'flex'; throw new Error('no webgl2'); }

    const isMobile = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 900;
    const maxDpr = isMobile ? 1.25 : 1.75;
    let renderScale = params.has('scale') ? parseFloat(params.get('scale')) : 1.0;
    const adaptive = !params.has('scale');
    const CUBE_SIZE = isMobile ? 256 : 512;

    const CAPTURE = params.has('capture');   // deterministic, on-demand frames (for screenshots)
    // keep the HDR/MSAA buffers within a sane pixel budget on 4K / retina screens
    const PIXEL_BUDGET = isMobile ? 1.6e6 : 3.7e6;
    const pixelRatio = () => Math.min(devicePixelRatio, maxDpr, Math.sqrt(PIXEL_BUDGET / (innerWidth * innerHeight))) * renderScale;
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
    renderer.setPixelRatio(pixelRatio());
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = params.get('tm') === 'agx' ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 60000);
    camera.position.set(0, 30, 100);
    camera.layers.enable(0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.target.set(0, 10, 0);
    controls.minDistance = 40;
    controls.maxDistance = 200;
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.update();

    // ------------------------------------------------------------------
    //  Physical atmosphere (shared constants between JS and GLSL)
    //  Units: kilometres. Single scattering Rayleigh + Mie + ozone.
    // ------------------------------------------------------------------
    // The sun slowly sets and rises in a loop: golden hour on a clear blue day, down through
    // sunset into dusk, then back up. ?sun=<deg> pins it (0.5 = the original's horizon sunset),
    // ?cycle=<seconds> changes the loop length.
    const deg = THREE.MathUtils.degToRad;
    const SUN_FIXED = params.has('sun');
    const SUN_HIGH = 9.0, SUN_LOW = -3.5, SUN_START = 5.5;
    const SUN_CYCLE = params.has('cycle') ? Math.max(10, parseFloat(params.get('cycle'))) : 480;
    const SUN_PHASE0 = Math.acos((SUN_START - (SUN_HIGH + SUN_LOW) / 2) / ((SUN_HIGH - SUN_LOW) / 2)); // starts at 5.5 deg, setting
    function sunElevation(t) {
      if (SUN_FIXED) return deg(parseFloat(params.get('sun')));
      const mid = (SUN_HIGH + SUN_LOW) / 2, amp = (SUN_HIGH - SUN_LOW) / 2;
      return deg(mid + amp * Math.cos(SUN_PHASE0 + 2 * Math.PI * t / SUN_CYCLE));
    }
    let SUN_ELEV = sunElevation(0);
    const SUN_E = 20.0;                               // solar irradiance (arbitrary HDR units)
    const MIE = 0.9;                                  // clean maritime air
    const OZONE = 2.0;
    let sunTheta = Math.PI;
    const sunDir = new THREE.Vector3();

    const ATMO_GLSL = /* glsl */`
      const float PR = 6360.0;
      const float AR = 6420.0;
      const vec3  BR = vec3(5.802e-3, 13.558e-3, 33.1e-3);
      const float BMS = 3.996e-3;
      const float BME = 4.440e-3;
      const vec3  BO = vec3(0.650e-3, 1.881e-3, 0.085e-3) * ${OZONE.toFixed(2)};
      const float HR = 8.0;
      const float HM = 1.2;
      const float MIE = ${MIE.toFixed(3)};
      const float SUN_E = ${SUN_E.toFixed(3)};
      const float PI = 3.14159265;

      vec2 raySphere(vec3 ro, vec3 rd, float r) {
        float b = dot(ro, rd);
        float c = dot(ro, ro) - r * r;
        float d = b * b - c;
        if (d < 0.0) return vec2(-1.0);
        d = sqrt(d);
        return vec2(-b - d, -b + d);
      }
      vec3 dens(float h) {
        return vec3(exp(-h / HR), exp(-h / HM), max(0.0, 1.0 - abs(h - 25.0) / 15.0));
      }
      vec3 extinction(vec3 d) { return BR * d.x + vec3(BME * MIE * d.y) + BO * d.z; }
      vec3 sunTransmittance(vec3 p, vec3 L) {
        float t = raySphere(p, L, AR).y;
        vec3 od = vec3(0.0);
        float ds = t / 6.0;
        for (int i = 0; i < 6; i++) {
          vec3 q = p + L * ((float(i) + 0.5) * ds);
          od += extinction(dens(length(q) - PR)) * ds;
        }
        // soft planet shadow
        float h = length(p);
        float horizonCos = -sqrt(max(0.0, 1.0 - (PR * PR) / (h * h)));
        float s = smoothstep(horizonCos - 0.01, horizonCos + 0.005, dot(normalize(p), L));
        return exp(-od) * s;
      }
      float phaseR(float mu) { return 3.0 / (16.0 * PI) * (1.0 + mu * mu); }
      float phaseHG(float mu, float g) {
        float g2 = g * g;
        return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * mu, 1e-4), 1.5));
      }
      vec3 atmosphere(vec3 rd, vec3 L) {
        vec3 ro = vec3(0.0, PR + 0.01, 0.0);
        float tmax = raySphere(ro, rd, AR).y;
        float mu = dot(rd, L);
        float pr = phaseR(mu);
        float pm = phaseHG(mu, 0.76);
        vec3 sumR = vec3(0.0), sumM = vec3(0.0), od = vec3(0.0);
        const int N = 20;
        for (int i = 0; i < N; i++) {
          float a = float(i) / float(N), b = float(i + 1) / float(N);
          float t0 = tmax * a * a, t1 = tmax * b * b;
          float ds = t1 - t0;
          vec3 p = ro + rd * (0.5 * (t0 + t1));
          vec3 d = dens(length(p) - PR);
          vec3 e = extinction(d) * ds;
          od += 0.5 * e;
          vec3 T = exp(-od) * sunTransmittance(p, L);
          od += 0.5 * e;
          sumR += T * d.x * ds;
          sumM += T * d.y * ds;
        }
        vec3 single = SUN_E * (sumR * BR * pr + sumM * (BMS * MIE) * pm);
        // cheap multiple-scattering lift (keeps the zenith from going grey/black at sunset)
        vec3 ms = SUN_E * (sumR * BR + sumM * (BMS * MIE)) * (1.0 / (4.0 * PI)) * 0.45;
        return single + ms;
      }
    `;

    // ---- JS port of the same model (used for light colours / ambient terms)
    const A = { PR: 6360, AR: 6420, BR: [5.802e-3, 13.558e-3, 33.1e-3], BMS: 3.996e-3, BME: 4.44e-3, BO: [0.65e-3, 1.881e-3, 0.085e-3], HR: 8, HM: 1.2 };
    function jRaySphere(o, d, r) {
      const b = o[0] * d[0] + o[1] * d[1] + o[2] * d[2];
      const c = o[0] * o[0] + o[1] * o[1] + o[2] * o[2] - r * r;
      let k = b * b - c; if (k < 0) return [-1, -1]; k = Math.sqrt(k); return [-b - k, -b + k];
    }
    function jExt(h) {
      const dr = Math.exp(-h / A.HR), dm = Math.exp(-h / A.HM), dO = Math.max(0, 1 - Math.abs(h - 25) / 15);
      return [0, 1, 2].map(i => A.BR[i] * dr + A.BME * MIE * dm + A.BO[i] * OZONE * dO);
    }
    function jSunT(p, L) {
      const t = jRaySphere(p, L, A.AR)[1], ds = t / 8; const od = [0, 0, 0];
      for (let i = 0; i < 8; i++) {
        const s = (i + 0.5) * ds; const q = [p[0] + L[0] * s, p[1] + L[1] * s, p[2] + L[2] * s];
        const e = jExt(Math.hypot(q[0], q[1], q[2]) - A.PR); od[0] += e[0] * ds; od[1] += e[1] * ds; od[2] += e[2] * ds;
      }
      // soft planet shadow (matches the GLSL), so nothing is lit through the Earth after sunset
      const h = Math.hypot(p[0], p[1], p[2]);
      const horizonCos = -Math.sqrt(Math.max(0, 1 - (A.PR * A.PR) / (h * h)));
      const mu = (p[0] * L[0] + p[1] * L[1] + p[2] * L[2]) / h;
      const sh = THREE.MathUtils.smoothstep(mu, horizonCos - 0.01, horizonCos + 0.005);
      return od.map(v => Math.exp(-v) * sh);
    }
    function jSky(rd, L) {
      const ro = [0, A.PR + 0.01, 0]; const tmax = jRaySphere(ro, rd, A.AR)[1];
      const mu = rd[0] * L[0] + rd[1] * L[1] + rd[2] * L[2];
      const pr = 3 / (16 * Math.PI) * (1 + mu * mu), g = 0.76;
      const pm = (1 - g * g) / (4 * Math.PI * Math.pow(1 + g * g - 2 * g * mu, 1.5));
      const sR = [0, 0, 0], sM = [0, 0, 0], od = [0, 0, 0]; const N = 12;
      for (let i = 0; i < N; i++) {
        const t0 = tmax * (i / N) ** 2, t1 = tmax * ((i + 1) / N) ** 2, ds = t1 - t0, tm = (t0 + t1) / 2;
        const p = [ro[0] + rd[0] * tm, ro[1] + rd[1] * tm, ro[2] + rd[2] * tm];
        const h = Math.hypot(p[0], p[1], p[2]) - A.PR; const e = jExt(h);
        const dr = Math.exp(-h / A.HR), dm = Math.exp(-h / A.HM); const Ts = jSunT(p, L);
        for (let c = 0; c < 3; c++) { od[c] += 0.5 * e[c] * ds; const T = Math.exp(-od[c]) * Ts[c]; od[c] += 0.5 * e[c] * ds; sR[c] += T * dr * ds; sM[c] += T * dm * ds; }
      }
      return [0, 1, 2].map(c => SUN_E * (sR[c] * A.BR[c] * pr + sM[c] * A.BMS * MIE * pm) + SUN_E * (sR[c] * A.BR[c] + sM[c] * A.BMS * MIE) / (4 * Math.PI) * 0.45);
    }

    // ------------------------------------------------------------------
    //  3D cloud noise (tileable Perlin-Worley), baked on the GPU once
    // ------------------------------------------------------------------
    const NOISE_SIZE = 128;
    const noiseRT = new THREE.WebGL3DRenderTarget(NOISE_SIZE, NOISE_SIZE, NOISE_SIZE, { depthBuffer: false });
    Object.assign(noiseRT.texture, { wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, wrapR: THREE.RepeatWrapping, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false });
    {
      const mat = new THREE.ShaderMaterial({
        uniforms: { uZ: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
        fragmentShader: /* glsl */`
          varying vec2 vUv; uniform float uZ;
          vec3 hash33(vec3 p) {
            p = fract(p * vec3(0.1031, 0.1030, 0.0973));
            p += dot(p, p.yxz + 33.33);
            return fract((p.xxy + p.yxx) * p.zyx);
          }
          float gradNoise(vec3 x, float freq) {
            vec3 p = floor(x), w = fract(x);
            vec3 u = w * w * w * (w * (w * 6.0 - 15.0) + 10.0);
            float n = 0.0;
            float r[8];
            for (int i = 0; i < 8; i++) {
              vec3 o = vec3(float(i & 1), float((i >> 1) & 1), float((i >> 2) & 1));
              vec3 g = normalize(hash33(mod(p + o, freq)) * 2.0 - 1.0);
              r[i] = dot(g, w - o);
            }
            return mix(mix(mix(r[0], r[1], u.x), mix(r[2], r[3], u.x), u.y),
                       mix(mix(r[4], r[5], u.x), mix(r[6], r[7], u.x), u.y), u.z);
          }
          float worley(vec3 uv, float freq) {
            vec3 id = floor(uv), p = fract(uv);
            float md = 1e4;
            for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++) {
              vec3 o = vec3(x, y, z);
              vec3 h = hash33(mod(id + o, vec3(freq))) + o;
              vec3 d = p - h;
              md = min(md, dot(d, d));
            }
            return 1.0 - sqrt(md);
          }
          float perlinFbm(vec3 p, float freq, int oct) {
            float G = exp2(-0.85), amp = 1.0, noise = 0.0;
            for (int i = 0; i < oct; i++) { noise += amp * gradNoise(p * freq, freq); freq *= 2.0; amp *= G; }
            return noise;
          }
          float worleyFbm(vec3 p, float freq) {
            return worley(p * freq, freq) * 0.625 + worley(p * freq * 2.0, freq * 2.0) * 0.25 + worley(p * freq * 4.0, freq * 4.0) * 0.125;
          }
          float remap(float x, float a, float b, float c, float d) { return c + (x - a) / (b - a) * (d - c); }
          void main() {
            vec3 uvw = vec3(vUv, uZ);
            float freq = 4.0;
            float pfbm = mix(1.0, perlinFbm(uvw, 4.0, 7), 0.5);
            pfbm = abs(pfbm * 2.0 - 1.0);
            float g = worleyFbm(uvw, freq);
            float b = worleyFbm(uvw, freq * 2.0);
            float a = worleyFbm(uvw, freq * 4.0);
            float r = clamp(remap(pfbm, 0.0, 1.0, g, 1.0), 0.0, 1.0);
            gl_FragColor = vec4(r, g, b, a);
          }`
      });
      const q = new FullScreenQuad(mat);
      for (let z = 0; z < NOISE_SIZE; z++) {
        mat.uniforms.uZ.value = (z + 0.5) / NOISE_SIZE;
        renderer.setRenderTarget(noiseRT, z);
        q.render(renderer);
      }
      renderer.setRenderTarget(null);
      q.dispose(); mat.dispose();
    }

    // ------------------------------------------------------------------
    //  Sky + volumetric clouds, rendered into an HDR cubemap
    //  (one face per frame, so the expensive raymarch is amortised)
    // ------------------------------------------------------------------
    const cubeRT = new THREE.WebGLCubeRenderTarget(CUBE_SIZE, { type: THREE.HalfFloatType, generateMipmaps: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    const cubeCam = new THREE.CubeCamera(0.1, 10, cubeRT);
    cubeCam.coordinateSystem = renderer.coordinateSystem;
    cubeCam.updateCoordinateSystem();
    cubeCam.updateMatrixWorld(true);
    const cubeScene = new THREE.Scene();

    const skyCubeMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, depthTest: false,
      uniforms: {
        uSun: { value: new THREE.Vector3() },
        uTime: { value: 0 },
        uNoise: { value: noiseRT.texture },
        uSunCloud: { value: new THREE.Vector3() },
        uAmb: { value: new THREE.Vector3() },
        uCoverage: { value: params.has('cov') ? parseFloat(params.get('cov')) : 0.2 },
        uSunHigh: { value: new THREE.Vector3() },
        uWind: { value: new THREE.Vector2(0.010, 0.004) },
        uWaterTint: { value: new THREE.Vector3(0.002, 0.008, 0.008) }
      },
      vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: /* glsl */`
        precision highp float;
        precision highp sampler3D;
        varying vec3 vDir;
        uniform vec3 uSun, uSunCloud, uSunHigh, uAmb, uWaterTint;
        uniform float uTime, uCoverage;
        uniform vec2 uWind;
        uniform sampler3D uNoise;
        ${ATMO_GLSL}

        const float CB = 1.5;   // cloud base (km)
        const float CT = 4.2;   // cloud top (km) - tall, towering fair-weather cumulus
        const float SIGMA = 24.0;

        float remap(float x, float a, float b, float c, float d) { return c + (x - a) / (b - a) * (d - c); }
        float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

        float cloudDensity(vec3 p, bool detail) {
          float h = (length(p) - PR - CB) / (CT - CB);
          if (h < 0.0 || h > 1.0) return 0.0;
          vec3 q = p - vec3(0.0, PR, 0.0);
          q.xz += uWind * uTime;
          float weather = texture(uNoise, vec3(q.xz * 0.011, 0.37)).r;
          float weather2 = texture(uNoise, vec3(q.xz * 0.004 + 0.3, 0.71)).g;
          float cov = clamp(uCoverage + (weather - 0.55) * 0.55 + (weather2 - 0.5) * 0.35, 0.0, 1.0);
          vec4 n = texture(uNoise, q * vec3(0.052, 0.07, 0.052));
          float wf = n.g * 0.625 + n.b * 0.25 + n.a * 0.125;
          float base = remap(n.r, wf - 1.0, 1.0, 0.0, 1.0);
          // flat bases, rounded cauliflower tops: coverage shrinks with height
          float prof = smoothstep(0.0, 0.05, h) * smoothstep(1.0, 0.7, h);
          float c = cov * mix(1.0, 0.55, h * h);
          base = clamp(remap(base * prof, 1.0 - c, 1.0, 0.0, 1.0), 0.0, 1.0);
          base *= mix(0.55, 1.25, h);
          if (detail && base > 0.0) {
            vec4 d = texture(uNoise, q * 0.38 + vec3(0.0, uTime * 0.004, 0.0));
            float df = d.g * 0.625 + d.b * 0.25 + d.a * 0.125;
            df = mix(1.0 - df, df, clamp(h * 2.5, 0.0, 1.0));  // wispy bases, billowy tops
            base = clamp(remap(base, df * 0.42, 1.0, 0.0, 1.0), 0.0, 1.0);
          }
          return base;
        }

        float lightMarch(vec3 p) {
          float od = 0.0;
          float ds = 0.06;
          vec3 pos = p;
          for (int i = 0; i < 6; i++) {
            pos += uSun * ds;
            od += cloudDensity(pos, i < 2) * ds;
            ds *= 1.8;
          }
          return od * SIGMA * 0.4;
        }

        float dualPhase(float mu, float scale) {
          return mix(phaseHG(mu, 0.8 * scale), phaseHG(mu, -0.25 * scale), 0.25);
        }

        // returns rgb = in-scattered light (premultiplied), a = transmittance, also outputs mean distance
        vec4 clouds(vec3 rd, out float dist) {
          dist = 0.0;
          if (rd.y <= 0.0) return vec4(0.0, 0.0, 0.0, 1.0);
          vec3 ro = vec3(0.0, PR + 0.01, 0.0);
          float t0 = raySphere(ro, rd, PR + CB).y;
          float t1 = raySphere(ro, rd, PR + CT).y;
          if (t0 > 160.0) return vec4(0.0, 0.0, 0.0, 1.0);
          t1 = min(t1, t0 + 26.0);
          const int N = ${isMobile ? 36 : 56};
          float dt = (t1 - t0) / float(N);
          float t = t0 + dt * hash12(gl_FragCoord.xy);
          float mu = dot(rd, uSun);
          vec3 S = vec3(0.0);
          float T = 1.0;
          float tw = 0.0, ww = 0.0;
          for (int i = 0; i < N; i++) {
            vec3 p = ro + rd * t;
            float den = cloudDensity(p, true);
            if (den > 0.002) {
              float h = clamp((length(p) - PR - CB) / (CT - CB), 0.0, 1.0);
              float od = lightMarch(p);
              // multiple-scattering octaves (Hillaire 2016)
              vec3 sun = vec3(0.0);
              float a = 1.0, b = 1.0, c = 1.0;
              for (int o = 0; o < 4; o++) {
                sun += a * dualPhase(mu, c) * exp(-od * b);
                a *= 0.55; b *= 0.4; c *= 0.6;
              }
              // powder / dark-edge term
              float powder = 1.0 - exp(-den * SIGMA * 0.12);
              vec3 amb = uAmb * mix(0.5, 1.6, h) * (0.6 + 0.4 * powder);
              vec3 lum = uSunCloud * sun * mix(0.6, 1.0, powder) * 4.0 * PI * 0.25 + amb;
              float ext = den * SIGMA;
              float Ts = exp(-ext * dt);
              S += T * lum * (1.0 - Ts);
              tw += t * T * (1.0 - Ts); ww += T * (1.0 - Ts);
              T *= Ts;
              if (T < 0.01) break;
            }
            t += dt;
          }
          dist = ww > 0.0 ? tw / ww : t0;
          float fade = smoothstep(160.0, 90.0, t0);
          return vec4(S * fade, mix(1.0, T, fade));
        }

        void main() {
          vec3 rd = normalize(vDir);
          if (rd.y < 0.0) {
            // below the horizon: reflective sea (used for image based lighting only)
            vec3 rr = vec3(rd.x, -rd.y, rd.z);
            float c = clamp(-rd.y, 0.0, 1.0);
            float F = 0.02 + 0.98 * pow(1.0 - c, 5.0);
            vec3 sky = atmosphere(rr, uSun);
            gl_FragColor = vec4(sky * F + uWaterTint * uAmb * 3.0, 1.0);
            return;
          }
          vec3 sky = atmosphere(rd, uSun);
          // high cirrus / altocumulus veil (catches the last pink light)
          {
            vec3 ro = vec3(0.0, PR + 0.01, 0.0);
            float tc = raySphere(ro, rd, PR + 7.5).y;

    // ------------------------------------------------------------------

    function buildDuckGeometry() {

        quad(cellVert[cidx(i - 1, j - 1, k)], cellVert[cidx(i, j - 1, k)], cellVert[cidx(i, j, k)], cellVert[cidx(i - 1, j, k)]);

    function buildEyeGeometry() {

      const e = mirrorCam.projectionMatrix.elements;
      _q.x = (Math.sign(_clip.x) + e[8]) / e[0];
      _q.y = (Math.sign(_clip.y) + e[9]) / e[5];
      _q.z = -1.0;
      _q.w = (1.0 + e[10]) / e[14];
      _clip.multiplyScalar(2.0 / _clip.dot(_q));
      e[2] = _clip.x; e[6] = _clip.y; e[10] = _clip.z + 1.0; e[14] = _clip.w;
      mirrorCam.projectionMatrixInverse.copy(mirrorCam.projectionMatrix).invert();
    }

    // ------------------------------------------------------------------
    //  Post: depth of field -> bloom -> lens/film composite
    // ------------------------------------------------------------------
    const dofMat = new THREE.ShaderMaterial({
      uniforms: {
        tColor: { value: null }, tDepth: { value: null },
        uNear: { value: camera.near }, uFar: { value: camera.far },
        uFocus: { value: 100 }, uAperture: { value: 3.0 }, uMaxCoc: { value: 7.0 },
        uRes: { value: new THREE.Vector2() }, uExposure: { value: params.has('ev') ? parseFloat(params.get('ev')) : 0.72 }
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: /* glsl */`
        #include <packing>
        varying vec2 vUv;
        uniform sampler2D tColor, tDepth;
        uniform float uNear, uFar, uFocus, uAperture, uMaxCoc, uExposure;
        uniform vec2 uRes;
        float lin(vec2 uv) { return -perspectiveDepthToViewZ(texture(tDepth, uv).x, uNear, uFar); }
        float coc(float z) { return min(uAperture * abs(z - uFocus) / max(z, 1e-3), uMaxCoc); }
        void main() {
          float zc = lin(vUv);
          float cc = coc(zc);
          vec3 acc = texture(tColor, vUv).rgb;
          float wsum = 1.0;
          const int N = 40;
          for (int i = 0; i < N; i++) {
            float fi = float(i) + 0.5;
            float r = sqrt(fi / float(N)) * uMaxCoc;
            float th = fi * 2.39996323;
            vec2 o = vec2(cos(th), sin(th)) * r;
            vec2 uv = vUv + o / uRes;
            float zs = lin(uv);
            float cs = coc(zs);
            if (zs > zc) cs = min(cs, cc * 1.5 + 0.5);
            float w = smoothstep(r - 1.0, r + 0.5, cs);
            vec3 s = texture(tColor, uv).rgb;
            // bokeh: favour bright taps a little so highlights bloom into discs
            w *= 1.0 + 0.25 * min(dot(s, vec3(0.3, 0.6, 0.1)), 20.0) * step(1.5, cs);
            acc += s * w; wsum += w;
          }
          gl_FragColor = vec4(acc / wsum * uExposure, 1.0);
        }`
    });
    const dofQuad = new FullScreenQuad(dofMat);

    const compMat = new THREE.ShaderMaterial({
      uniforms: {
        tColor: { value: null }, tBloom: { value: null }, tDepth: { value: null }, uBloom: { value: 0.05 },
        uSky: { value: cubeRT.texture }, uSunDir: { value: sunDir },
        uTime: { value: 0 }, uRes: { value: new THREE.Vector2() },
        uSunUV: { value: new THREE.Vector2() }, uSunVis: { value: 0 }, uSunCol: { value: new THREE.Vector3() }
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: /* glsl */`
        varying vec2 vUv;
        uniform sampler2D tColor, tBloom, tDepth;
        uniform samplerCube uSky;
        uniform vec3 uSunDir;
        uniform float uTime, uSunVis, uBloom;
        uniform vec2 uRes, uSunUV;
        uniform vec3 uSunCol;
        float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
        void main() {
          vec2 uv = vUv;
          vec2 c = uv - 0.5;
          float aspect = uRes.x / uRes.y;
          // gentle barrel distortion + lateral chromatic aberration
          float r2 = dot(c * vec2(aspect, 1.0), c * vec2(aspect, 1.0));
          vec2 duv = c * (1.0 + 0.018 * r2);
          vec2 ca = duv * 0.0028 * r2;
          vec3 col;
          col.r = texture(tColor, 0.5 + duv - ca).r;
          col.g = texture(tColor, 0.5 + duv).g;
          col.b = texture(tColor, 0.5 + duv + ca).b;

          // round bloom (energy conserving mix; the mip chain sums 7 levels)
          vec3 bl = texture(tBloom, 0.5 + duv).rgb / 7.0;
          col = mix(col, bl, uBloom);

          // how much of the sun is actually visible: cloud transmittance x unoccluded by ducks
          float vis = 0.0;
          if (uSunVis > 0.001) {
            float clear = 0.0;
            for (int i = 0; i < 5; i++) {
              vec2 o = vec2(float(i - 2) * 0.004, float((i * 3) % 5 - 2) * 0.004);
              clear += step(0.99999, texture(tDepth, uSunUV + o).x);
            }
            vis = uSunVis * (clear / 5.0) * texture(uSky, uSunDir).a;
          }

          // circular sun glare (veiling glare of the lens), aspect-correct
          if (vis > 0.001) {
            float r = length((uv - uSunUV) * vec2(aspect, 1.0));
            float glare = 0.03 * exp(-r * 55.0) + 0.006 * exp(-r * 14.0) + 0.0012 * exp(-r * 4.0);
            col += uSunCol * vis * glare * 20.0;
          }

          // lens ghosts from the sun
          if (vis > 0.001) {
            vec2 axis = vec2(0.5) - uSunUV;
            vec3 g = vec3(0.0);
            float k[6] = float[6](0.35, 0.62, 0.9, 1.25, 1.55, 1.85);
            float sz[6] = float[6](0.018, 0.04, 0.012, 0.07, 0.03, 0.11);
            vec3 tint[6] = vec3[6](vec3(0.9,0.6,0.3), vec3(0.3,0.6,0.9), vec3(1.0,0.8,0.5), vec3(0.4,0.9,0.6), vec3(0.9,0.5,0.8), vec3(0.5,0.6,1.0));
            for (int i = 0; i < 6; i++) {
              vec2 gp = uSunUV + axis * k[i] * 2.0;
              float d = length((uv - gp) * vec2(aspect, 1.0));
              g += tint[i] * smoothstep(sz[i], sz[i] * 0.55, d) * 0.5;
            }
            float hd = length((uv - (uSunUV + axis * 2.0)) * vec2(aspect, 1.0));
            g += vec3(0.6, 0.7, 1.0) * smoothstep(0.02, 0.0, abs(hd - 0.32)) * 0.25;
            col += g * uSunCol * vis * 0.004;
          }

          // camera white balance (auto-WB pulls golden hour slightly toward neutral)
          col *= vec3(0.93, 0.99, 1.10);

          // vignette (natural cos^4-ish falloff)
          float vig = pow(clamp(1.0 - r2 * 0.32, 0.0, 1.0), 2.0);
          col *= vig;

          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>

          // film grain (luma weighted, temporal)
          float n = hash(gl_FragCoord.xy + fract(uTime * 7.31) * 1000.0) + hash(gl_FragCoord.xy * 1.7 + fract(uTime * 3.17) * 500.0) - 1.0;
          float l = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));
          gl_FragColor.rgb += n * mix(0.035, 0.012, l);
        }`
    });
    const compQuad = new FullScreenQuad(compMat);

    // ------------------------------------------------------------------
    //  Email overlay (identical to the original page)
    // ------------------------------------------------------------------
    {
      const dotCanvas = document.createElement('canvas'); dotCanvas.width = 700; dotCanvas.height = 80;
      const dotCtx = dotCanvas.getContext('2d');
      const tmp = document.createElement('canvas'); tmp.width = 700; tmp.height = 80;
      const tctx = tmp.getContext('2d');
      tctx.fillStyle = 'white'; tctx.font = 'bold 42px monospace'; tctx.textAlign = 'right'; tctx.textBaseline = 'middle';
      tctx.fillText('andrew@fursman.com', 692, 40);
      const data = tctx.getImageData(0, 0, 700, 80).data;
      dotCtx.fillStyle = 'white';
      for (let y = 0; y < 80; y += 4) for (let x = 0; x < 700; x += 4) {
        if (data[(y * 700 + x) * 4 + 3] > 128) { dotCtx.beginPath(); dotCtx.arc(x + 2, y + 2, 2, 0, Math.PI * 2); dotCtx.fill(); }
      }
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;bottom:4px;right:8px;pointer-events:none;opacity:0.7;z-index:1;';
      const img = document.createElement('img'); img.src = dotCanvas.toDataURL(); img.style.cssText = 'height:56px;';
      overlay.appendChild(img); document.body.appendChild(overlay);
    }

    // ------------------------------------------------------------------
    //  Lighting state (recomputed from the atmosphere model)
    // ------------------------------------------------------------------
    const sunE = new THREE.Vector3(), sunCloud = new THREE.Vector3(), amb = new THREE.Vector3();
    const BASE_EV = params.has('ev') ? parseFloat(params.get('ev')) : 0.72;
    const luma = (v) => 0.2126 * v.x + 0.7152 * v.y + 0.0722 * v.z;
    // metering key: direct sun + average sky radiance
    function meterKey(L) {
      const t = jSunT([0, A.PR + 0.01, 0], L);
      let k = (0.2126 * t[0] + 0.7152 * t[1] + 0.0722 * t[2]) * SUN_E * 0.25;
      for (const el of [0.08, 0.35, 0.8]) for (let a = 0; a < 6; a++) {
        const az = a / 6 * Math.PI * 2, ce = Math.cos(el);
        const sk = jSky([Math.cos(az) * ce, Math.sin(el), Math.sin(az) * ce], L);
        k += (0.2126 * sk[0] + 0.7152 * sk[1] + 0.0722 * sk[2]) / 18;
      }
      return k;
    }
    // BASE_EV was tuned for the 0.5 degree sunset; other sun heights are metered relative to it
    const REF_KEY = meterKey([0, Math.sin(THREE.MathUtils.degToRad(0.5)), -Math.cos(THREE.MathUtils.degToRad(0.5))]);
    let targetExposure = BASE_EV;
    function updateLighting() {
      const L = [sunDir.x, sunDir.y, sunDir.z];
      const tg = jSunT([0, A.PR + 0.01, 0], L);
      const tc = jSunT([0, A.PR + 2.0, 0], L);
      sunE.set(tg[0], tg[1], tg[2]).multiplyScalar(SUN_E);
      sunCloud.set(tc[0], tc[1], tc[2]).multiplyScalar(SUN_E);
      const th = jSunT([0, A.PR + 7.5, 0], L);
      skyCubeMat.uniforms.uSunHigh.value.set(th[0], th[1], th[2]).multiplyScalar(SUN_E);
      // average sky radiance over the upper hemisphere
      const acc = [0, 0, 0]; let n = 0;
      for (const el of [0.08, 0.35, 0.8]) for (let a = 0; a < 6; a++) {
        const az = a / 6 * Math.PI * 2, ce = Math.cos(el);
        const s = jSky([Math.cos(az) * ce, Math.sin(el), Math.sin(az) * ce], L);
        acc[0] += s[0]; acc[1] += s[1]; acc[2] += s[2]; n++;
      }
      amb.set(acc[0] / n, acc[1] / n, acc[2] / n);
      skyCubeMat.uniforms.uSunCloud.value.copy(sunCloud);
      skyCubeMat.uniforms.uAmb.value.copy(amb);
      waterMat.uniforms.uSunE.value.copy(sunE);
      waterMat.uniforms.uAmb.value.copy(amb);
      const lum = Math.max(sunE.x, sunE.y, sunE.z, 1e-6);
      sunLight.color.setRGB(sunE.x / lum, sunE.y / lum, sunE.z / lum, THREE.LinearSRGBColorSpace);
      sunLight.intensity = lum;
      const omega = 2 * Math.PI * (1 - Math.cos(SUN_ANG));
      skyDomeMat.uniforms.uSunDisk.value.copy(sunE).multiplyScalar(1 / omega).clampScalar(0, 40000);
      if (vinyl.userData.shader) vinyl.userData.shader.uniforms.uSunColV.value.copy(sunE);
      compMat.uniforms.uSunCol.value.copy(sunE);
      // auto exposure: meter on direct sun + sky light, like a camera in program mode
      const key = luma(sunE) * 0.25 + luma(amb);
      // (the gain is capped so dusk reads as dusk instead of being pumped back to daylight)
      targetExposure = BASE_EV * THREE.MathUtils.clamp(Math.pow(REF_KEY / Math.max(key, 1e-5), 0.55), 0.2, 6.0);
    }
    function setSun() {
      sunDir.setFromSphericalCoords(1, Math.PI / 2 - SUN_ELEV, sunTheta);
      skyCubeMat.uniforms.uSun.value.copy(sunDir);
    }
    setSun();
    updateLighting();
    dofMat.uniforms.uExposure.value = targetExposure;

    // prime the cubemap + environment
    for (let i = 0; i < 6; i++) renderCubeFace(i);
    rebuildEnv();

    // ------------------------------------------------------------------
    //  Simulation
    // ------------------------------------------------------------------
    let hasInteracted = false;
    let autoPanAngle = Math.PI * 0.5;
    setTimeout(() => {
      ['mousemove', 'mousedown', 'touchstart', 'wheel'].forEach(evt =>
        renderer.domElement.addEventListener(evt, () => { hasInteracted = true; }, { once: true }));
    }, 2000);

    const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion(), _up = new THREE.Vector3(0, 1, 0), _nrm = new THREE.Vector3();
    function updateDucks(t, dt) {
      const f = dt * 60;
      for (let i = 0; i < DUCKS; i++) {
        const d = ducks[i];
        d.x += d.driftX * f; d.z += d.driftZ * f;
        if (Math.abs(d.x) > 80) { d.driftX *= -1; d.x = Math.sign(d.x) * 80; }
        if (Math.abs(d.z) > 80) { d.driftZ *= -1; d.z = Math.sign(d.z) * 80; }
        d.yaw += d.rotateSpeed * f;
        for (let j = i + 1; j < DUCKS; j++) {
          const o = ducks[j];
          const dx = d.x - o.x, dz = d.z - o.z, distSq = dx * dx + dz * dz;
          const minDist = 2.8 * d.s + 2.8 * o.s;
          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq), force = (minDist - dist) * 0.02 * f;
            d.driftX += dx / dist * force; d.driftZ += dz / dist * force;
            o.driftX -= dx / dist * force; o.driftZ -= dz / dist * force;
            const lim = 0.15;
            d.driftX = THREE.MathUtils.clamp(d.driftX, -lim, lim); d.driftZ = THREE.MathUtils.clamp(d.driftZ, -lim, lim);
            o.driftX = THREE.MathUtils.clamp(o.driftX, -lim, lim); o.driftZ = THREE.MathUtils.clamp(o.driftZ, -lim, lim);
          }
        }
        // buoyancy: damped spring toward the local surface
        const target = waveHeight(d.x, d.z, t) + 0.5 * d.s;
        d.vy += ((target - d.y) * 7.0 - d.vy * 2.6) * dt;
        d.y += d.vy * dt;
        const [sx, sz] = waveSlope(d.x, d.z, t);
        const k = 1 - Math.exp(-dt * 2.5);
        d.tx += (sx - d.tx) * k; d.tz += (sz - d.tz) * k;
        const wob = 0.012 * Math.sin(t * 1.3 + d.wob);
        _nrm.set(-d.tx * 0.85 + wob, 1, -d.tz * 0.85 + 0.6 * wob).normalize();
        _qa.setFromUnitVectors(_up, _nrm);
        _qb.setFromAxisAngle(_up, d.yaw);
        _qa.multiply(_qb);
        _m.compose(_p.set(d.x, d.y, d.z), _qa, _s.setScalar(d.s));
        duckMesh.setMatrixAt(i, _m);
        eyeMesh.setMatrixAt(i, _m);
        waterMat.uniforms.uDuckA.value[i].set(d.x, d.z, d.yaw, d.s);
        waterMat.uniforms.uDuckB.value[i].set(d.vy, d.wob * 3.0, 0, 0);
      }
      duckMesh.instanceMatrix.needsUpdate = true;
      eyeMesh.instanceMatrix.needsUpdate = true;
    }

    // smooth value noise for a hand-held camera feel
    const shake = (t, s) => Math.sin(t * 0.71 + s) * 0.5 + Math.sin(t * 1.37 + s * 2.1) * 0.3 + Math.sin(t * 2.93 + s * 3.7) * 0.2;

    // ------------------------------------------------------------------
    //  Frame
    // ------------------------------------------------------------------
    const clock = new THREE.Clock();
    let simTime = 0, lastEnv = 0, lastLight = 0, focus = 100;
    let frames = 0, ftAcc = 0, lastAdapt = 0, started = false;
    const _sp = new THREE.Vector3();

    function frame(fixedDt) {
      if (!CAPTURE) requestAnimationFrame(frame);
      const dt = CAPTURE ? fixedDt : Math.min(clock.getDelta(), 0.1);
      simTime += dt;
      const t = simTime;

      // sun drifts sideways exactly like the original (per-frame rate converted to seconds),
      // and now also slowly sets and rises
      sunTheta += 0.000035 * 60 * dt;
      SUN_ELEV = sunElevation(t);
      setSun();
      if (t - lastLight > 0.5) { updateLighting(); lastLight = t; }
      { // eye-like exposure adaptation
        const u = dofMat.uniforms.uExposure;
        u.value += (targetExposure - u.value) * (CAPTURE ? 1 : 1 - Math.exp(-dt * 1.5));
      }

      updateDucks(t, dt);

      // camera: same kiosk auto-pan as the original, plus a hint of hand-held motion
      if (!hasInteracted) {
        autoPanAngle += 0.000133 * 60 * dt;
        camera.position.set(Math.cos(autoPanAngle) * 100, 25 + Math.sin(autoPanAngle * 0.3) * 8, Math.sin(autoPanAngle) * 100);
        controls.target.set(0, 10, 0);
      }
      controls.update();
      camera.rotateX(shake(t, 1.0) * 0.0018);
      camera.rotateY(shake(t, 4.0) * 0.0024);
      camera.rotateZ(shake(t, 9.0) * 0.0012);
      camera.updateMatrixWorld();

      // sun shadow frustum follows the duck pond
      sunLight.position.copy(sunDir).multiplyScalar(350);
      sunLight.target.position.set(0, 0, 0);
      sunLight.target.updateMatrixWorld();

      // 1. sky/cloud cubemap: one face per frame; refresh image-based lighting periodically
      skyCubeMat.uniforms.uTime.value = t;
      renderCubeFace(cubeFace);
      cubeFace = (cubeFace + 1) % 6;
      if (t - lastEnv > 2.0 && cubeFace === 0) { rebuildEnv(); lastEnv = t; }

      // 2. reflection
      waterMat.uniforms.uTime.value = t;
      updateOcean(t);
      updateMirror();
      water.visible = false;
      skyDomeMat.uniforms.uNoSun.value = 1;
      renderer.shadowMap.needsUpdate = true;
      renderer.setRenderTarget(reflRT);
      renderer.render(scene, mirrorCam);

      // 3. refraction (ducks only)
      camera.layers.set(1);
      renderer.setClearColor(0x000000, 0);
      renderer.setRenderTarget(refrRT);
      renderer.clear();
      renderer.render(scene, camera);
      camera.layers.set(0);
      renderer.setClearColor(0x000000, 1);
      water.visible = true;
      skyDomeMat.uniforms.uNoSun.value = 0;

      // 4. main HDR pass
      renderer.getDrawingBufferSize(size);
      waterMat.uniforms.tRefl.value = reflRT.texture;
      waterMat.uniforms.tRefr.value = refrRT.texture;
      waterMat.uniforms.tRefrDepth.value = refrRT.depthTexture;
      waterMat.uniforms.uRes.value.copy(size);
      // sun visibility through clouds (for the glitter path and lens flare)
      renderer.setRenderTarget(sceneRT);
      renderer.render(scene, camera);

      // 5. depth of field with a slow "autofocus" on the duck flock
      const want = camera.position.distanceTo(controls.target);
      focus = CAPTURE ? want : focus + (want - focus) * (1 - Math.exp(-dt * 2.0));
      const res = size.y / 1080;
      dofMat.uniforms.tColor.value = sceneRT.texture;
      dofMat.uniforms.tDepth.value = sceneRT.depthTexture;
      dofMat.uniforms.uFocus.value = focus;
      dofMat.uniforms.uAperture.value = 2.6 * res;
      dofMat.uniforms.uMaxCoc.value = Math.max(1.0, 6.5 * res);
      dofMat.uniforms.uRes.value.copy(size);
      renderer.setRenderTarget(dofRT);
      dofQuad.render(renderer);

      // 6. bloom
      compMat.uniforms.tBloom.value = bloom.render(renderer, dofRT.texture, size.x, size.y);
      compMat.uniforms.tDepth.value = sceneRT.depthTexture;

      // 7. lens + film composite to screen
      _sp.copy(sunDir).multiplyScalar(1000).add(camera.position).project(camera);
      const onScreen = _sp.z < 1 && Math.abs(_sp.x) < 1.2 && Math.abs(_sp.y) < 1.2;
      compMat.uniforms.uSunUV.value.set(_sp.x * 0.5 + 0.5, _sp.y * 0.5 + 0.5);
      compMat.uniforms.uSunVis.value = onScreen ? Math.max(0, 1 - Math.hypot(_sp.x * camera.aspect, _sp.y) / (1.3 * camera.aspect)) : 0;
      compMat.uniforms.uTime.value = t;
      compMat.uniforms.tColor.value = dofRT.texture;
      compMat.uniforms.uRes.value.copy(size);
      renderer.setRenderTarget(null);
      compQuad.render(renderer);

      if (!started) { started = true; requestAnimationFrame(() => document.getElementById('curtain').classList.add('gone')); }

      // adaptive resolution
      if (adaptive && !CAPTURE) {
        frames++; ftAcc += dt;
        if (t - lastAdapt > 3 && frames > 20) {
          const avg = ftAcc / frames;
          let next = renderScale;
          if (avg > 1 / 40 && renderScale > 0.5) next = Math.max(0.5, renderScale - 0.15);
          else if (avg < 1 / 75 && renderScale < 1) next = Math.min(1, renderScale + 0.1);
          if (next !== renderScale) { renderScale = next; resize(); }
          frames = 0; ftAcc = 0; lastAdapt = t;
        }
      }
    }

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(pixelRatio());
      renderer.setSize(innerWidth, innerHeight);
      allocTargets();
    }
    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => clock.getDelta());

    if (CAPTURE) {
      window.__frame = (dt, n = 1) => { for (let i = 0; i < n; i++) frame(dt); return true; };
      window.__setTime = (t) => { simTime = t; };
      window.__setPan = (a) => { autoPanAngle = a; };
      window.__view = (p, t) => { hasInteracted = true; camera.position.set(...p); controls.target.set(...t); };
      window.__ducks = ducks; window.__controls = controls;
      window.__setSun = (th) => { sunTheta = th; };
      window.__dbg = { renderCubeFace, rebuildEnv, THREE, renderer, scene, camera, skyDome, water, skyDomeMat, mirrorCam, cubeRT, reflRT: () => reflRT, sceneRT: () => sceneRT, skyCubeMat, waterMat, cubeCam, sunDir, amb, sunE };
      window.__ready = true;
    } else frame();
  </script>
</body>
