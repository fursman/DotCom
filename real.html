<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We can make anything</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦾</text></svg>">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #curtain { position: fixed; inset: 0; background: #000; pointer-events: none; transition: opacity 2.5s ease; z-index: 2; }
    #curtain.gone { opacity: 0; }
    #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #aaa; font: 16px monospace; z-index: 3; }
    #nogl a { color: #fff; }
  </style>
</head>
<body>
  <div id="curtain"></div>
  <div id="nogl">This one needs WebGL2. <a href="/">Back to the ducks</a></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

    // ------------------------------------------------------------------
    //  Setup & quality tiers
    //  ?q=low|med|high pins the tier, ?scale=<0.4..1> pins the render scale,
    //  ?hud shows frame timings.
    // ------------------------------------------------------------------
    const params = new URLSearchParams(location.search);
    const CAPTURE = params.has('capture');   // deterministic, on-demand frames (for screenshots)
    const isMobile = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 900;
    let gpuName = '';
    {
      const probe = document.createElement('canvas').getContext('webgl2');
      if (!probe) { document.getElementById('nogl').style.display = 'flex'; throw new Error('no webgl2'); }
      try {
        const e = probe.getExtension('WEBGL_debug_renderer_info');
        gpuName = String(probe.getParameter(e ? e.UNMASKED_RENDERER_WEBGL : probe.RENDERER) || '');
      } catch (err) { /* masked */ }
      const lose = probe.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext();
    }
    // 0 = phones / integrated / software, 1 = unknown or mid-range, 2 = discrete & Apple silicon.
    // The GPU name is only a first guess: before the curtain lifts, a few frames are timed end to
    // end and the tier is moved to what this machine can actually do (see boot), and the governor
    // keeps adjusting to the measured frame time after that.
    const tierPinned = params.has('q');
    let tierCap = 2;
    let TIER = (() => {
      const named = { low: 0, med: 1, medium: 1, high: 2 }[params.get('q')];
      if (named !== undefined) return named;
      let t = 1;
      if (isMobile || /swiftshader|llvmpipe|software|basic render|mali|adreno|powervr|videocore|vivante/i.test(gpuName)) t = 0;
      else if (/nvidia|geforce|rtx|gtx|quadro|radeon\s*(\(tm\)\s*)?(rx|pro)|\barc\b|apple m\d/i.test(gpuName)) t = 2;
      else if (/intel/i.test(gpuName) && !/iris|\bxe\b/i.test(gpuName)) t = 0;
      try {
        // a tier this same GPU measured its way to on an earlier visit beats the name-based guess
        const seen = JSON.parse(localStorage.getItem('realTier') || 'null');
        if (seen && seen.gpu === gpuName && seen.tier >= 0 && seen.tier <= 2) t = seen.tier | 0;
        const cap = sessionStorage.getItem('realTierCap');
        if (cap !== null) tierCap = THREE.MathUtils.clamp(+cap || 0, 0, 2);
      } catch (err) { /* private mode */ }
      return Math.min(t, tierCap);
    })();
    const TIERS = [
      { budget: 1.6e6, dpr: 1.25, msaa: 2, cube: 512, tile: 128, tiles: 1.0, steps: 36, shadow: [2048, 512], soft: false, aniso: 2, env: 128, duck: [40, 24], rip: 384, dof: 12 },
      { budget: 2.6e6, dpr: 1.5, msaa: 4, cube: 768, tile: 192, tiles: 1.5, steps: 48, shadow: [2048, 512], soft: true, aniso: 4, env: 128, duck: [48, 26], rip: 512, dof: 16 },
      { budget: 3.7e6, dpr: 1.75, msaa: 4, cube: 1024, tile: 256, tiles: 2.0, steps: 64, shadow: [4096, 1024], soft: true, aniso: 8, env: 256, duck: [60, 28], rip: 512, dof: 22 }
    ];
    if (params.has('msaa')) for (const q of TIERS) q.msaa = parseInt(params.get('msaa')) || 0;
    let Q = TIERS[TIER];

    // the governor walks this ladder: resolution first, then cloud refresh rate and MSAA
    const LADDER = [
      { scale: 1.00, tiles: 1.00, msaa: 8 },
      { scale: 0.86, tiles: 0.75, msaa: 8 },
      { scale: 0.74, tiles: 0.50, msaa: 8 },
      { scale: 0.63, tiles: 0.50, msaa: 2 },
      { scale: 0.54, tiles: 0.35, msaa: 2 },
      { scale: 0.46, tiles: 0.25, msaa: 0 }
    ];
    const msaaFor = (lv) => Math.min(Q.msaa, LADDER[lv].msaa);
    const adaptive = !params.has('scale') && !CAPTURE;
    let level = 0;
    let renderScale = params.has('scale') ? THREE.MathUtils.clamp(parseFloat(params.get('scale')) || 1, 0.25, 1) : 1.0;
    let msaa = Q.msaa;

    const pixelRatio = () => Math.min(devicePixelRatio, Q.dpr, Math.sqrt(Q.budget / (innerWidth * innerHeight))) * renderScale;
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
    renderer.setPixelRatio(pixelRatio());
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = params.get('tm') === 'agx' ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = Q.soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
    renderer.shadowMap.autoUpdate = false;
    document.body.appendChild(renderer.domElement);
    const gl = renderer.getContext();
    const floatRT = renderer.extensions.has('EXT_color_buffer_float');
    const aniso = () => Math.min(params.has('aniso') ? parseFloat(params.get('aniso')) : Q.aniso, renderer.capabilities.getMaxAnisotropy());

    // a lost context on a struggling GPU comes back one tier lower (at most twice per tab)
    renderer.domElement.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      try {
        const n = +(sessionStorage.getItem('realReloads') || 0);
        if (n >= 2) return;
        sessionStorage.setItem('realReloads', String(n + 1));
        sessionStorage.setItem('realTierCap', String(Math.max(0, TIER - 1)));
      } catch (err) { return; }
      setTimeout(() => location.reload(), 600);
    });

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 60000);
    camera.position.set(0, 30, 100);
    camera.layers.enable(0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.target.set(0, 10, 0);
    controls.minDistance = 40;
    controls.maxDistance = 200;
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.update();

    const fsVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
    const fsQuad = new FullScreenQuad(null);
    const blit = (mat, target) => { fsQuad.material = mat; renderer.setRenderTarget(target); fsQuad.render(renderer); };
    const nextFrame = () => new Promise(r => requestAnimationFrame(r));

    // ------------------------------------------------------------------
    //  Physical atmosphere (shared constants between JS and GLSL)
    //  Units: kilometres. Single scattering Rayleigh + Mie + ozone.
    // ------------------------------------------------------------------
    // The sun slowly sets and rises in a loop: golden hour on a clear blue day, down through
    // sunset into dusk, then back up. ?sun=<deg> pins it (0.5 = the original's horizon sunset),
    // ?cycle=<seconds> changes the loop length.
    const deg = THREE.MathUtils.degToRad;
    const SUN_FIXED = params.has('sun');
    const SUN_HIGH = 9.0, SUN_LOW = -3.5, SUN_START = 5.5;
    const SUN_CYCLE = params.has('cycle') ? Math.max(10, parseFloat(params.get('cycle'))) : 480;
    const SUN_PHASE0 = Math.acos((SUN_START - (SUN_HIGH + SUN_LOW) / 2) / ((SUN_HIGH - SUN_LOW) / 2)); // starts at 5.5 deg, setting
    function sunElevation(t) {
      if (SUN_FIXED) return deg(parseFloat(params.get('sun')));
      const mid = (SUN_HIGH + SUN_LOW) / 2, amp = (SUN_HIGH - SUN_LOW) / 2;
      return deg(mid + amp * Math.cos(SUN_PHASE0 + 2 * Math.PI * t / SUN_CYCLE));
    }
    let SUN_ELEV = sunElevation(0);
    const SUN_E = 20.0;                               // solar irradiance (arbitrary HDR units)
    const MIE = 0.9;                                  // clean maritime air
    const OZONE = 2.0;
    let sunTheta = Math.PI;
    const sunDir = new THREE.Vector3();

    const ATMO_GLSL = /* glsl */`
      const float PR = 6360.0;
      const float AR = 6420.0;
      const vec3  BR = vec3(5.802e-3, 13.558e-3, 33.1e-3);
      const float BMS = 3.996e-3;
      const float BME = 4.440e-3;
      const vec3  BO = vec3(0.650e-3, 1.881e-3, 0.085e-3) * ${OZONE.toFixed(2)};
      const float HR = 8.0;
      const float HM = 1.2;
      const float MIE = ${MIE.toFixed(3)};
      const float SUN_E = ${SUN_E.toFixed(3)};
      const float PI = 3.14159265;

      vec2 raySphere(vec3 ro, vec3 rd, float r) {
        float b = dot(ro, rd);
        float c = dot(ro, ro) - r * r;
        float d = b * b - c;
        if (d < 0.0) return vec2(-1.0);
        d = sqrt(d);
        return vec2(-b - d, -b + d);
      }
      vec3 dens(float h) {
        return vec3(exp(-h / HR), exp(-h / HM), max(0.0, 1.0 - abs(h - 25.0) / 15.0));
      }
      vec3 extinction(vec3 d) { return BR * d.x + vec3(BME * MIE * d.y) + BO * d.z; }
      vec3 sunTransmittance(vec3 p, vec3 L) {
        float t = raySphere(p, L, AR).y;
        vec3 od = vec3(0.0);
        float ds = t / 6.0;
        for (int i = 0; i < 6; i++) {
          vec3 q = p + L * ((float(i) + 0.5) * ds);
          od += extinction(dens(length(q) - PR)) * ds;
        }
        // soft planet shadow
        float h = length(p);
        float horizonCos = -sqrt(max(0.0, 1.0 - (PR * PR) / (h * h)));
        float s = smoothstep(horizonCos - 0.01, horizonCos + 0.005, dot(normalize(p), L));
        return exp(-od) * s;
      }
      float phaseR(float mu) { return 3.0 / (16.0 * PI) * (1.0 + mu * mu); }
      float phaseHG(float mu, float g) {
        float g2 = g * g;
        return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * mu, 1e-4), 1.5));
      }
      vec3 atmosphere(vec3 rd, vec3 L) {
        vec3 ro = vec3(0.0, PR + 0.01, 0.0);
        float tmax = raySphere(ro, rd, AR).y;
        float mu = dot(rd, L);
        float pr = phaseR(mu);
        float pm = phaseHG(mu, 0.76);
        vec3 sumR = vec3(0.0), sumM = vec3(0.0), od = vec3(0.0);
        const int N = 20;
        for (int i = 0; i < N; i++) {
          float a = float(i) / float(N), b = float(i + 1) / float(N);
          float t0 = tmax * a * a, t1 = tmax * b * b;
          float ds = t1 - t0;
          vec3 p = ro + rd * (0.5 * (t0 + t1));
          vec3 d = dens(length(p) - PR);
          vec3 e = extinction(d) * ds;
          od += 0.5 * e;
          vec3 T = exp(-od) * sunTransmittance(p, L);
          od += 0.5 * e;
          sumR += T * d.x * ds;
          sumM += T * d.y * ds;
        }
        vec3 single = SUN_E * (sumR * BR * pr + sumM * (BMS * MIE) * pm);
        // cheap multiple-scattering lift (keeps the zenith from going grey/black at sunset)
        vec3 ms = SUN_E * (sumR * BR + sumM * (BMS * MIE)) * (1.0 / (4.0 * PI)) * 0.45;
        return single + ms;
      }
    `;

    // ---- JS port of the same model (used for light colours / ambient terms)
    const A = { PR: 6360, AR: 6420, BR: [5.802e-3, 13.558e-3, 33.1e-3], BMS: 3.996e-3, BME: 4.44e-3, BO: [0.65e-3, 1.881e-3, 0.085e-3], HR: 8, HM: 1.2 };
    function jRaySphere(o, d, r) {
      const b = o[0] * d[0] + o[1] * d[1] + o[2] * d[2];
      const c = o[0] * o[0] + o[1] * o[1] + o[2] * o[2] - r * r;
      let k = b * b - c; if (k < 0) return [-1, -1]; k = Math.sqrt(k); return [-b - k, -b + k];
    }
    function jExt(h) {
      const dr = Math.exp(-h / A.HR), dm = Math.exp(-h / A.HM), dO = Math.max(0, 1 - Math.abs(h - 25) / 15);
      return [0, 1, 2].map(i => A.BR[i] * dr + A.BME * MIE * dm + A.BO[i] * OZONE * dO);
    }
    function jSunT(p, L) {
      const t = jRaySphere(p, L, A.AR)[1], ds = t / 8; const od = [0, 0, 0];
      for (let i = 0; i < 8; i++) {
        const s = (i + 0.5) * ds; const q = [p[0] + L[0] * s, p[1] + L[1] * s, p[2] + L[2] * s];
        const e = jExt(Math.hypot(q[0], q[1], q[2]) - A.PR); od[0] += e[0] * ds; od[1] += e[1] * ds; od[2] += e[2] * ds;
      }
      // soft planet shadow (matches the GLSL), so nothing is lit through the Earth after sunset
      const h = Math.hypot(p[0], p[1], p[2]);
      const horizonCos = -Math.sqrt(Math.max(0, 1 - (A.PR * A.PR) / (h * h)));
      const mu = (p[0] * L[0] + p[1] * L[1] + p[2] * L[2]) / h;
      const sh = THREE.MathUtils.smoothstep(mu, horizonCos - 0.01, horizonCos + 0.005);
      return od.map(v => Math.exp(-v) * sh);
    }
    function jSky(rd, L) {
      const ro = [0, A.PR + 0.01, 0]; const tmax = jRaySphere(ro, rd, A.AR)[1];
      const mu = rd[0] * L[0] + rd[1] * L[1] + rd[2] * L[2];
      const pr = 3 / (16 * Math.PI) * (1 + mu * mu), g = 0.76;
      const pm = (1 - g * g) / (4 * Math.PI * Math.pow(1 + g * g - 2 * g * mu, 1.5));
      const sR = [0, 0, 0], sM = [0, 0, 0], od = [0, 0, 0]; const N = 12;
      for (let i = 0; i < N; i++) {
        const t0 = tmax * (i / N) ** 2, t1 = tmax * ((i + 1) / N) ** 2, ds = t1 - t0, tm = (t0 + t1) / 2;
        const p = [ro[0] + rd[0] * tm, ro[1] + rd[1] * tm, ro[2] + rd[2] * tm];
        const h = Math.hypot(p[0], p[1], p[2]) - A.PR; const e = jExt(h);
        const dr = Math.exp(-h / A.HR), dm = Math.exp(-h / A.HM); const Ts = jSunT(p, L);
        for (let c = 0; c < 3; c++) { od[c] += 0.5 * e[c] * ds; const T = Math.exp(-od[c]) * Ts[c]; od[c] += 0.5 * e[c] * ds; sR[c] += T * dr * ds; sM[c] += T * dm * ds; }
      }
      return [0, 1, 2].map(c => SUN_E * (sR[c] * A.BR[c] * pr + sM[c] * A.BMS * MIE * pm) + SUN_E * (sR[c] * A.BR[c] + sM[c] * A.BMS * MIE) / (4 * Math.PI) * 0.45);
    }

    // ------------------------------------------------------------------
    //  Sky-view LUT: the atmosphere integral is smooth, so it is solved once
    //  into a small (azimuth-from-sun, elevation) table a few times a second
    //  and every consumer just looks it up. Clouds live in a separate cubemap
    //  as (in-scattered light, transmittance), so the sky behind them is
    //  always live even though the clouds themselves are time-sliced.
    // ------------------------------------------------------------------
    const LUT_W = 256, LUT_H = 128;
    const lutRT = new THREE.WebGLRenderTarget(LUT_W, LUT_H, { type: THREE.HalfFloatType, depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    const lutMat = new THREE.ShaderMaterial({
      uniforms: { uSunL: { value: new THREE.Vector2(1, 0) } },
      vertexShader: fsVS,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform vec2 uSunL;   // (cos, sin) of the sun elevation; the sun azimuth is +x in LUT space
        ${ATMO_GLSL}
        void main() {
          vec2 uv = (gl_FragCoord.xy - 0.5) / vec2(${LUT_W - 1}.0, ${LUT_H - 1}.0);
          float phi = uv.x * PI, el = uv.y * uv.y * 0.5 * PI;
          vec3 rd = vec3(cos(el) * cos(phi), sin(el), cos(el) * sin(phi));
          gl_FragColor = vec4(atmosphere(rd, vec3(uSunL.x, uSunL.y, 0.0)), 1.0);
        }`
    });
    const SKYLUT_GLSL = /* glsl */`
      uniform sampler2D tSkyLut;
      uniform vec2 uSunAz;
      vec3 skyLut(vec3 rd) {
        float el = asin(clamp(rd.y, 0.0, 1.0));
        float phi = acos(clamp(dot(rd.xz, uSunAz) / max(length(rd.xz), 1e-5), -1.0, 1.0));
        vec2 uv = vec2(phi * 0.318309886, sqrt(el * 0.636619772));
        return texture(tSkyLut, (uv * vec2(${LUT_W - 1}.0, ${LUT_H - 1}.0) + 0.5) / vec2(${LUT_W}.0, ${LUT_H}.0)).rgb;
      }`;
    // sky + clouds in one call. The cloud light is stored divided by a brightness key and
    // multiplied back by the current one, so tiles rendered a second apart still match at dusk.
    const SKY_GLSL = SKYLUT_GLSL + /* glsl */`
      uniform samplerCube uSky;
      uniform float uSkyKey;
      vec4 skyAt(vec3 d) { vec4 c = texture(uSky, d); return vec4(skyLut(d) * c.a + c.rgb * uSkyKey, c.a); }`;
    const skyU = { tSkyLut: { value: lutRT.texture }, uSunAz: { value: new THREE.Vector2(0, -1) }, uSky: { value: null }, uSkyKey: { value: 1 } };
    function renderSkyLut() {
      lutMat.uniforms.uSunL.value.set(Math.cos(SUN_ELEV), Math.sin(SUN_ELEV));
      blit(lutMat, lutRT);
    }

    // ------------------------------------------------------------------
    //  3D cloud noise (tileable Perlin-Worley), baked on the GPU once
    // ------------------------------------------------------------------
    const NOISE_SIZE = 128;
    const noiseRT = new THREE.WebGL3DRenderTarget(NOISE_SIZE, NOISE_SIZE, NOISE_SIZE, { depthBuffer: false });
    Object.assign(noiseRT.texture, { wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, wrapR: THREE.RepeatWrapping, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false });
    const noiseMat = new THREE.ShaderMaterial({
      uniforms: { uZ: { value: 0 } },
      vertexShader: fsVS,
      fragmentShader: /* glsl */`
        varying vec2 vUv; uniform float uZ;
        vec3 hash33(vec3 p) {
          p = fract(p * vec3(0.1031, 0.1030, 0.0973));
          p += dot(p, p.yxz + 33.33);
          return fract((p.xxy + p.yxx) * p.zyx);
        }
        float gradNoise(vec3 x, float freq) {
          vec3 p = floor(x), w = fract(x);
          vec3 u = w * w * w * (w * (w * 6.0 - 15.0) + 10.0);
          float r[8];
          for (int i = 0; i < 8; i++) {
            vec3 o = vec3(float(i & 1), float((i >> 1) & 1), float((i >> 2) & 1));
            vec3 g = normalize(hash33(mod(p + o, freq)) * 2.0 - 1.0);
            r[i] = dot(g, w - o);
          }
          return mix(mix(mix(r[0], r[1], u.x), mix(r[2], r[3], u.x), u.y),
                     mix(mix(r[4], r[5], u.x), mix(r[6], r[7], u.x), u.y), u.z);
        }
        float worley(vec3 uv, float freq) {
          vec3 id = floor(uv), p = fract(uv);
          float md = 1e4;
          for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++) {
            vec3 o = vec3(x, y, z);
            vec3 h = hash33(mod(id + o, vec3(freq))) + o;
            vec3 d = p - h;
            md = min(md, dot(d, d));
          }
          return 1.0 - sqrt(md);
        }
        float perlinFbm(vec3 p, float freq, int oct) {
          float G = exp2(-0.85), amp = 1.0, noise = 0.0;
          for (int i = 0; i < oct; i++) { noise += amp * gradNoise(p * freq, freq); freq *= 2.0; amp *= G; }
          return noise;
        }
        float remap(float x, float a, float b, float c, float d) { return c + (x - a) / (b - a) * (d - c); }
        void main() {
          vec3 uvw = vec3(vUv, uZ);
          float pfbm = mix(1.0, perlinFbm(uvw, 4.0, 7), 0.5);
          pfbm = abs(pfbm * 2.0 - 1.0);
          // the three Worley fBms share octaves: five evaluations instead of nine
          float w4 = worley(uvw * 4.0, 4.0), w8 = worley(uvw * 8.0, 8.0), w16 = worley(uvw * 16.0, 16.0);
          float w32 = worley(uvw * 32.0, 32.0), w64 = worley(uvw * 64.0, 64.0);
          float g = w4 * 0.625 + w8 * 0.25 + w16 * 0.125;
          float b = w8 * 0.625 + w16 * 0.25 + w32 * 0.125;
          float a = w16 * 0.625 + w32 * 0.25 + w64 * 0.125;
          float r = clamp(remap(pfbm, 0.0, 1.0, g, 1.0), 0.0, 1.0);
          gl_FragColor = vec4(r, g, b, a);
        }`
    });
    function bakeNoise(z0, z1) {
      fsQuad.material = noiseMat;
      for (let z = z0; z < z1; z++) {
        noiseMat.uniforms.uZ.value = (z + 0.5) / NOISE_SIZE;
        renderer.setRenderTarget(noiseRT, z);
        fsQuad.render(renderer);
      }
      renderer.setRenderTarget(null);
    }

    // ------------------------------------------------------------------
    //  Volumetric clouds, raymarched into an HDR cubemap a few tiles per
    //  frame. Tiles the camera (or its reflection) can see are refreshed
    //  about three times as often as the rest; tiles below the horizon are
    //  never touched.
    // ------------------------------------------------------------------
    let cubeRT = null;

      vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,

        precision highp float;

          float prof = smoothstep(0.0, 0.05, h) * smoothstep(1.0, 0.7, h);
          float c = cov * mix(1.0, 0.55, h * h);
          base = clamp(remap(base * prof, 1.0 - c, 1.0, 0.0, 1.0), 0.0, 1.0);
          base *= mix(0.55, 1.25, h);
          if (detail && base > 0.0) {
            vec4 d = texture(uNoise, q * 0.38 + vec3(0.0, uTime * 0.004, 0.0));
            float df = d.g * 0.625 + d.b * 0.25 + d.a * 0.125;
            df = mix(1.0 - df, df, clamp(h * 2.5, 0.0, 1.0));  // wispy bases, billowy tops
            base = clamp(remap(base, df * 0.42, 1.0, 0.0, 1.0), 0.0, 1.0);

        float lightMarch(vec3 p) {
          float od = 0.0;

        float dualPhase(float mu, float scale) {
          return mix(phaseHG(mu, 0.8 * scale), phaseHG(mu, -0.25 * scale), 0.25);
        }

        // returns rgb = in-scattered light (premultiplied), a = transmittance, also outputs mean distance
        vec4 clouds(vec3 rd, out float dist) {
          dist = 0.0;
          vec3 ro = vec3(0.0, PR + 0.01, 0.0);
          float t0 = raySphere(ro, rd, PR + CB).y;
          float t1 = raySphere(ro, rd, PR + CT).y;
          if (t0 > 160.0) return vec4(0.0, 0.0, 0.0, 1.0);
          t1 = min(t1, t0 + 26.0);
          float dt = (t1 - t0) / float(uSteps);
          float t = t0 + dt * hash12(gl_FragCoord.xy);
          float mu = dot(rd, uSun);
          vec3 S = vec3(0.0);
          float T = 1.0;
          float tw = 0.0, ww = 0.0;
          for (int i = 0; i < uSteps; i++) {
            vec3 p = ro + rd * t;

            if (den > 0.002) {
              float h = clamp((length(p) - PR - CB) / (CT - CB), 0.0, 1.0);
              float od = lightMarch(p);
              // multiple-scattering octaves (Hillaire 2016)
              float sun = 0.0;
              float a = 1.0, b = 1.0, c = 1.0;
              for (int o = 0; o < 4; o++) {
                sun += a * dualPhase(mu, c) * exp(-od * b);
                a *= 0.55; b *= 0.4; c *= 0.6;

            vec2 uv = q.xz + uWind * uTime * 2.5;
            vec2 w = uv * 0.012;
            vec2 warp = vec2(texture(uNoise, vec3(w * 0.7, 0.2)).g, texture(uNoise, vec3(w * 0.7 + 0.5, 0.6)).g);
            vec2 st = mat2(0.8, -0.6, 0.6, 0.8) * (uv * vec2(0.018, 0.036)) + warp * 0.3;
            float c = texture(uNoise, vec3(st, 0.45)).r * 0.65 + texture(uNoise, vec3(st * 3.1, 0.8)).g * 0.35;
            float m = texture(uNoise, vec3(uv * 0.0035, 0.9)).g;
            float den = smoothstep(0.6, 0.92, c) * smoothstep(0.5, 0.8, m) * 0.45;
            den *= smoothstep(0.0, 0.04, rd.y) * smoothstep(420.0, 150.0, tc);
            float mu = dot(rd, uSun);

          // here is everything else: cloud light, cirrus, and the (small) sky terms they replace.
          float fog = 1.0 - exp(-d / 38.0);

        }
      `
    });
    cubeScene.add(new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), cloudMat));

    let tiles = [];
    function buildCloudCube() {
      if (cubeRT) cubeRT.dispose();

      skyU.uSky.value = cubeRT.texture;
      const TILES_PER = Q.cube / Q.tile;
      tiles = [];
      const v = new THREE.Vector3();
      for (let f = 0; f < 6; f++) for (let ty = 0; ty < TILES_PER; ty++) for (let tx = 0; tx < TILES_PER; tx++) {
        const dirs = []; let maxY = -1;
        for (let j = 0; j <= 2; j++) for (let i = 0; i <= 2; i++) {
          v.set(((tx + i / 2) / TILES_PER) * 2 - 1, ((ty + j / 2) / TILES_PER) * 2 - 1, 0.5).unproject(cubeCam.children[f]).normalize();

    }
    buildCloudCube();
    let frameNo = 0, tileBudget = 0;

    const _fw = new THREE.Vector3();

      camera.getWorldDirection(_fw);

      for (const tl of tiles) {

    //      the horizon) is what gets prefiltered, so the periodic PMREM rebuild stays cheap
    let envSrcRT = null, envCam = null, envRT = null;
    function buildEnvCube() {
      if (envSrcRT) envSrcRT.dispose();
      if (envRT) { envRT.dispose(); envRT = null; }   // the prefiltered target is sized for its source: start over
      envSrcRT = new THREE.WebGLCubeRenderTarget(Q.env, { type: THREE.HalfFloatType, generateMipmaps: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });
      envCam = new THREE.CubeCamera(0.1, 10, envSrcRT);

    buildEnvCube();
    const envScene = new THREE.Scene();
    const envMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, depthTest: false,
      uniforms: { ...skyU, uAmb: { value: new THREE.Vector3() }, uWaterTint: { value: new THREE.Vector3(0.002, 0.008, 0.008) } },
      vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,

        precision highp float;
        varying vec3 vDir;
        uniform vec3 uAmb, uWaterTint;

        void main() {

    // ------------------------------------------------------------------
    //  Sky dome for the main view: LUT sky + cloud cube + analytic sun disc
    //  + a few stars and an evening star once the light goes
    // ------------------------------------------------------------------
    const SUN_ANG = THREE.MathUtils.degToRad(0.32);
    const skyDomeMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, depthTest: true,

        ...skyU,

        uSquash: { value: 1 },
        uNoSun: { value: 0 },
        uStars: { value: 0 },

        varying vec3 vDir;

      fragmentShader: /* glsl */`
        precision highp float;
        varying vec3 vDir;
        uniform vec3 uSun, uSunDisk;
        uniform vec4 uVenus;
        uniform float uSunCos, uNoSun, uSquash, uStars, uPix, uTime;
        ${SKY_GLSL}
        vec3 hash32(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
          p3 += dot(p3, p3.yxz + 33.33);

        }
        // sparse point stars on a cube-face lattice; every star is a ~1.5px soft dot that twinkles
        float stars(vec3 d) {
          vec3 a = abs(d); vec2 uv; float face;
          if (a.y >= a.x && a.y >= a.z) { uv = d.xz / a.y; face = 0.0; }
          else if (a.x >= a.z) { uv = d.zy / a.x; face = d.x > 0.0 ? 1.0 : 2.0; }
          else { uv = d.xy / a.z; face = d.z > 0.0 ? 3.0 : 4.0; }
          const float n = 46.0;
          vec2 g = uv * n, id = floor(g);
          vec3 h = hash32(id + face * 71.0);
          vec3 h2 = hash32(id.yx + face * 13.0 + 5.0);
          if (h2.x > 0.16) return 0.0;
          float px = uPix * n * (1.0 + dot(uv, uv)) * 0.8;
          float dd = length(g - id - 0.2 - 0.6 * h.xy) / px;
          float mag = 0.25 + 3.0 * pow(h2.y, 5.0);
          float tw = 0.72 + 0.28 * sin(uTime * (1.6 + 3.0 * h.z) + h.z * 50.0);
          return smoothstep(1.7, 0.5, dd) * mag * tw;
        }
        void main() {
          vec3 d = normalize(vDir);
          vec3 dd = normalize(vec3(d.x, max(d.y, 0.0008), d.z));
          vec4 s = skyAt(dd);
          vec3 col = s.rgb;
          if (uNoSun < 0.5) {
            // atmospheric refraction flattens the low sun a little
            vec3 o = d - uSun;
            float c = dot(normalize(uSun + vec3(o.x, o.y / uSquash, o.z)), uSun);
            float w = fwidth(c) * 1.5;
            float disk = smoothstep(uSunCos - w, uSunCos + w, c);
            if (disk > 0.0) {
              float r = clamp(acos(clamp(c, -1.0, 1.0)) / acos(uSunCos), 0.0, 1.0);
              float mu = sqrt(max(0.0, 1.0 - r * r));

              col += uSunDisk * limb * disk * s.a;
            }
            if (uStars > 0.0) {

              col += vec3(0.82, 0.9, 1.0) * (stars(d) * uStars * ext);
              float vd = acos(clamp(dot(d, uVenus.xyz), -1.0, 1.0)) / uPix;
              col += vec3(1.0, 0.96, 0.88) * (smoothstep(2.4, 0.8, vd) * uVenus.w * s.a);

    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), skyDomeMat);
    skyDome.frustumCulled = false;
    skyDome.renderOrder = 1000;   // drawn last: depth-tested against water and ducks, so hidden sky is never shaded
    scene.add(skyDome);

    // ------------------------------------------------------------------
    //  Waves: shared between the GPU water and CPU duck buoyancy.
    //  Every angular frequency is snapped to a multiple of 2*pi/LOOP so the

    // ------------------------------------------------------------------

    const swell = [];
    [[260, 0.30, 0.0], [175, 0.20, 0.45], [118, 0.13, -0.5], [74, 0.07, 0.9]].forEach(([wl, amp, da]) => {

    });
    // ------------------------------------------------------------------
    //  Wind waves: GPU FFT ocean (Tessendorf). A directional wind spectrum is
    //  evolved with the dispersion relation and inverse-FFT'd every frame into
    //  slope maps. Three cascades at non-integer size ratios (and rotated) cover
    //  wavelengths from ~60 units down to ~0.3 without visible tiling. The maps
    //  store (sx, sz, sx^2, sz^2) and are mipmapped, so distant water averages
    //  slopes and keeps their variance as roughness (correct sun glitter).
    //  All three cascades share one atlas, so the whole transform is 16 passes.
    // ------------------------------------------------------------------
    const FFT_N = 128, FFT_LOG = 7;
    const CASCADES = [
      { L: 377, band: [12.0, 60.0], rot: 0.0 },
      { L: 61.3, band: [1.9, 12.0], rot: 0.71 },
      { L: 9.7, band: [0.3, 1.9], rot: 1.93 }
    ];
    const WIND_SPEED = 9.0;
    const gauss = () => { const u = Math.max(rand(), 1e-9), v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    let h0Tex;
    {
      const Lw = WIND_SPEED * WIND_SPEED / GRAV;
      const wx = Math.cos(windAng), wz = Math.sin(windAng);
      let slopeVar = 0;
      for (const c of CASCADES) {
        const data = new Float32Array(FFT_N * FFT_N * 4);
        for (let m = 0; m < FFT_N; m++) for (let n = 0; n < FFT_N; n++) {
          const kx = 2 * Math.PI * (n < FFT_N / 2 ? n : n - FFT_N) / c.L;
          const kz = 2 * Math.PI * (m < FFT_N / 2 ? m : m - FFT_N) / c.L;
          const k = Math.hypot(kx, kz);
          const i = (m * FFT_N + n) * 4;
          if (k < 1e-6) continue;
          const wl = 2 * Math.PI / k;
          if (wl < c.band[0] || wl >= c.band[1]) continue;
          const d = (kx * wx + kz * wz) / k;

    // ------------------------------------------------------------------

      // with a measurement in hand, slow frames that are cheap to generate are someone else's
      // doing (a capped frame rate, a busy main thread) and lowering quality would not help
      const slow = timed ? (gpuMs > 15 || (avg > 25 && gpuMs > 10)) : avg > 21.5;
      const fast = timed && gpuMs < 8.5 && avg < 19.5;
      // stepping down that buys nothing means the frame rate is capped elsewhere (battery saver,
      // a 30 Hz display, a busy main thread): give the quality back and stop chasing it
      if (gov.before) {
        if (avg > gov.before * 0.93) gov.noGain++; else { gov.noGain = 0; gov.lastGood = level; }
        gov.before = 0;
        if (gov.noGain >= 2) { gov.locked = true; setLevel(gov.lastGood, now); return; }
      }
      if (slow && !gov.locked && level < LADDER.length - 1) {
        if (now < gov.probing) gov.probeDelay = Math.min(gov.probeDelay * 2, 300);   // the last probe was too optimistic
        gov.before = avg;
        setLevel(level + ((timed ? gpuMs > 28 : avg > 42) ? 2 : 1), now);
        gov.probeAt = now + gov.probeDelay;
      } else if (level > 0 && !gov.locked && (fast || (!timed && now > gov.probeAt && avg < 18.5))) {
        setLevel(level - 1, now);
        gov.probing = now + 8; gov.probeAt = now + gov.probeDelay;
      }
    }

    let hud = null, hudAt = 0;
    if (params.has('hud')) {
      hud = document.createElement('div');
      hud.style.cssText = 'position:fixed;top:6px;left:8px;z-index:4;color:#fff;font:11px/1.45 monospace;white-space:pre;text-shadow:0 0 3px #000;pointer-events:none;opacity:.85';
      document.body.appendChild(hud);
    }

    // ------------------------------------------------------------------
    //  Frame
    // ------------------------------------------------------------------
    const clock = new THREE.Clock();
    const ENV_PERIOD = 1.5;
    let simTime = 0, lastEnv = 0, focus = 100, started = false, live = false;
    const _sp = new THREE.Vector3();

    function frame(fixedDt) {
      if (live) requestAnimationFrame(frame);
      const rawDt = live ? clock.getDelta() : fixedDt;
      const t0 = performance.now();
      if (live && adaptive && !tqExt && genPhase === 0 && t0 > genAt) genPhase = 2;
      const dt = Math.min(rawDt, 0.1);
      simTime += dt; frameNo++;
      const t = simTime, tLoop = t % LOOP;
      if (tqExt) { gpuPoll(); gpuBegin(); }

      // sun drifts sideways exactly like the original (per-frame rate converted to seconds),
      // and slowly sets and rises
      sunTheta += 0.000035 * 60 * dt;
      SUN_ELEV = sunElevation(t);
      setSun();
      if (CAPTURE || frameNo % 4 === 1) updateLighting();
      { // eye-like exposure adaptation
        const u = compMat.uniforms.uExposure;
        u.value += (targetExposure - u.value) * (CAPTURE ? 1 : 1 - Math.exp(-dt * 1.5));
      }
      sunVis += (sunVisTarget - sunVis) * (CAPTURE ? 1 : 1 - Math.exp(-dt * 2.5));
      applySunVis();

      updateDucks(t, dt);

      // camera: same kiosk auto-pan as the original, plus a hint of hand-held motion
      if (!hasInteracted) {
        autoPanAngle += 0.000133 * 60 * dt;
        camera.position.set(Math.cos(autoPanAngle) * 100, 25 + Math.sin(autoPanAngle * 0.3) * 8, Math.sin(autoPanAngle) * 100);
        controls.target.set(0, 10, 0);
      }
      controls.update();
      camera.rotateX(shake(t, 1.0) * 0.0018);
      camera.rotateY(shake(t, 4.0) * 0.0024);
      camera.rotateZ(shake(t, 9.0) * 0.0012);
      camera.updateMatrixWorld();

      // sun shadow frustum follows the duck pond
      sunLight.position.copy(sunDir).multiplyScalar(350);
      sunLight.target.position.set(0, 0, 0);
      sunLight.target.updateMatrixWorld();

      // 1. sky: refresh the LUT, a few cloud tiles, and (in two small steps) the image-based lighting
      if (CAPTURE || frameNo % 3 === 1) renderSkyLut();
      cloudMat.uniforms.uTime.value = t;
      weighTiles();
      tileBudget = Math.min(tileBudget + Q.tiles * LADDER[level].tiles, 4);
      while (tileBudget >= 1) { renderTile(pickTile()); tileBudget -= 1; }
      if (envStage === 1) { rebuildEnv(); envStage = 0; }
      else if (t - lastEnv > ENV_PERIOD) { renderEnvCube(); envStage = 1; lastEnv = t; }
      scene.environmentIntensity = skyU.uSkyKey.value / envKey;
      if (CAPTURE || frameNo % 6 === 2) probeSunVis();

      // 2. water: FFT wind waves and the duck-ripple simulation
      updateOcean(tLoop);
      stepRipples(dt);

      // 3. shadow map + planar reflection, both with the light duck meshes
      renderer.getDrawingBufferSize(size);
      const pix = 2 * Math.tan(deg(camera.fov / 2)) / size.y;
      waterMat.uniforms.uTime.value = tLoop;
      waterMat.uniforms.uTimeS.value = t % 6000;
      waterMat.uniforms.uPix.value = pix;
      skyDomeMat.uniforms.uPix.value = pix;
      skyDomeMat.uniforms.uTime.value = tLoop;
      updateMirror();
      water.visible = false;
      showLod(true);
      skyDomeMat.uniforms.uNoSun.value = 1;
      renderer.shadowMap.needsUpdate = TIER > 0 || frameNo % 2 === 1 || CAPTURE;
      renderer.setRenderTarget(reflRT);
      renderer.render(scene, mirrorCam);

      // 4. refraction (ducks only)
      camera.layers.set(1);
      renderer.setClearColor(0x000000, 0);
      renderer.setRenderTarget(refrRT);
      renderer.render(scene, camera);
      camera.layers.set(0);
      renderer.setClearColor(0x000000, 1);
      water.visible = true;
      showLod(false);
      skyDomeMat.uniforms.uNoSun.value = 0;

      // 5. main HDR pass
      waterMat.uniforms.tRefl.value = reflRT.texture;
      waterMat.uniforms.tRefr.value = refrRT.texture;
      waterMat.uniforms.tRefrDepth.value = refrRT.depthTexture;
      waterMat.uniforms.uRes.value.copy(size);
      renderer.setRenderTarget(sceneRT);
      renderer.render(scene, camera);

      // 6. depth of field at half resolution, with a slow "autofocus" on the duck flock
      const want = camera.position.distanceTo(controls.target);
      focus = CAPTURE ? want : focus + (want - focus) * (1 - Math.exp(-dt * 2.0));
      const res = size.y / 1080, aperture = 2.6 * res, maxCoc = Math.max(1.0, 6.5 * res);
      dofPreMat.uniforms.tColor.value = sceneRT.texture;
      dofPreMat.uniforms.tDepth.value = sceneRT.depthTexture;
      blit(dofPreMat, dofA);
      dofMat.uniforms.tHalf.value = dofA.texture;
      dofMat.uniforms.uFocus.value = focus;
      dofMat.uniforms.uAperture.value = aperture;
      dofMat.uniforms.uMaxCoc.value = maxCoc;
      dofMat.uniforms.uRes.value.copy(size);
      blit(dofMat, dofB);

      // 7. bloom
      const cu = compMat.uniforms;
      cu.tBloom.value = bloom.render(dofB.texture, size.x, size.y, cu.uExposure.value);

      // 8. lens + film composite to screen
      _sp.copy(sunDir).multiplyScalar(1000).add(camera.position).project(camera);
      const onScreen = _sp.z < 1 && Math.abs(_sp.x) < 1.2 && Math.abs(_sp.y) < 1.2;
      cu.uSunUV.value.set(_sp.x * 0.5 + 0.5, _sp.y * 0.5 + 0.5);
      cu.uSunVis.value = onScreen ? Math.max(0, 1 - Math.hypot(_sp.x * camera.aspect, _sp.y) / (1.3 * camera.aspect)) * sunVis : 0;
      cu.uTime.value = tLoop;
      cu.tColor.value = sceneRT.texture;
      cu.tDof.value = dofB.texture;
      cu.tDepth.value = sceneRT.depthTexture;
      cu.uFocus.value = focus; cu.uAperture.value = aperture; cu.uMaxCoc.value = maxCoc;
      cu.uRes.value.copy(size);
      blit(compMat, null);
      if (tqExt) gpuEnd();
      if (genPhase > 0) {
        waitForGpu();
        if (--genPhase === 0) {
          const ms = performance.now() - t0;
          gpuMs = gpuSamples ? gpuMs * 0.6 + ms * 0.4 : ms; gpuSamples++;
          genAt = performance.now() + GEN_EVERY;
        }
      }

      if ((live || CAPTURE) && !started) { started = true; requestAnimationFrame(() => document.getElementById('curtain').classList.add('gone')); }
      if (live && adaptive) govern(rawDt);
      if (hud && t - hudAt > 0.5) {
        hudAt = t;
        hud.textContent = `${gpuName.replace(/^ANGLE \(|\)$/g, '').slice(0, 70)}\ntier ${['low', 'med', 'high'][TIER]}  level ${level}/${LADDER.length - 1}${gov.locked ? ' (locked)' : ''}  ${size.x}x${size.y}  msaa ${msaa}\n` +
          `frame ${(gov.avg || rawDt * 1000).toFixed(1)} ms  ${tqExt ? 'gpu' : 'gen'} ${gpuSamples ? gpuMs.toFixed(1) + ' ms' : 'n/a'}${bootNote}  sun ${THREE.MathUtils.radToDeg(SUN_ELEV).toFixed(1)}°  vis ${sunVis.toFixed(2)}`;
      }
    }

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(pixelRatio());
      renderer.setSize(innerWidth, innerHeight);
      allocTargets();
    }
    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => clock.getDelta());

    // ------------------------------------------------------------------
    //  Boot: everything heavy is spread over a few frames behind the curtain,
    //  so even a slow GPU never sees one giant job
    // ------------------------------------------------------------------
    // rebuild everything a tier decides. Only ever called behind the curtain.
    function setTier(n) {
      TIER = n; Q = TIERS[n];
      renderer.shadowMap.type = Q.soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
      for (const m of [vinyl, paint, vinylLo, paintLo]) m.needsUpdate = true;
      sunLight.shadow.mapSize.set(Q.shadow[0], Q.shadow[1]);
      if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
      buildWaveTargets();
      waterMat.uniforms.tWave0.value = CASCADES[0].out.texture;
      waterMat.uniforms.tWave1.value = CASCADES[1].out.texture;
      waterMat.uniforms.tWave2.value = CASCADES[2].out.texture;
      buildRipples();
      waterMat.uniforms.tRipple.value = ripOut.texture;
      buildCloudCube(); clearCloudCube();
      buildEnvCube();
      duckGeo.dispose(); duckGeoLo.dispose();
      duckGeo = duckMesh.geometry = buildDuckGeometry(Q.duck[0]);
      duckGeoLo = duckLo.geometry = buildDuckGeometry(Q.duck[1]);
      cloudMat.uniforms.uSteps.value = Q.steps;
      dofMat.uniforms.uTaps.value = Q.dof;
      msaa = msaaFor(level);
      resize();
      refreshSky();
    }
    // frame generation time: hidden frames, each timed end to end with a blocking read-back.
    // The first few are thrown away (they compile shaders); the median of the rest is the answer.
    async function measureGen(n = 5, warm = 3) {
      const ts = [];
      for (let i = 0; i < n + warm; i++) {
        const t0 = performance.now();
        frame(1 / 60);
        waitForGpu();
        if (i >= warm) ts.push(performance.now() - t0);
        await nextFrame();
      }
      ts.sort((a, b) => a - b);
      return ts[ts.length >> 1];
    }
    // how much more a frame costs one tier up (more pixels, more samples, more cloud work)
    const TIER_GROWTH = [1.7, 1.5];
    let bootNote = '';
    async function fitTier() {
      const first = TIER;
      let gen = await measureGen();
      bootNote = `  (boot: ${['low', 'med', 'high'][first]} ${gen.toFixed(1)} ms`;
      if (!tierPinned) {
        // promote while the next tier is predicted to fit in about half a 60 Hz frame;
        // drop one if this tier does not fit in a frame at all
        let target = TIER, g = gen;
        while (target < tierCap && g * TIER_GROWTH[target] < 9) { g *= TIER_GROWTH[target]; target++; }
        if (target === TIER && gen > 18 && TIER > 0) target = TIER - 1;
        if (target !== TIER) {
          setTier(target);
          gen = await measureGen();
          // the prediction is only a prediction: if the new tier measures over budget, step back
          while (gen > 14 && TIER > first) { setTier(TIER - 1); gen = await measureGen(); }
          bootNote += ` -> ${['low', 'med', 'high'][TIER]} ${gen.toFixed(1)} ms`;
        }
        try { localStorage.setItem('realTier', JSON.stringify({ gpu: gpuName, tier: TIER })); } catch (err) { /* private mode */ }
      }
      bootNote += ')';
      if (!tqExt) { gpuMs = gen; gpuSamples = 2; genAt = performance.now() + GEN_EVERY; }
    }
    function refreshSky() {
      setSun(); updateLighting(); renderSkyLut();
      for (const tl of tiles) renderTile(tl);
      renderEnvCube(); rebuildEnv(); envStage = 0;
      probeSunVis();
    }
    async function boot() {
      const chunk = CAPTURE ? NOISE_SIZE : 16;
      for (let z = 0; z < NOISE_SIZE; z += chunk) { bakeNoise(z, Math.min(NOISE_SIZE, z + chunk)); if (!CAPTURE) await nextFrame(); }
      setSun(); updateLighting(); renderSkyLut(); clearCloudCube();
      let n = 0;
      for (const tl of tiles) { renderTile(tl); if (!CAPTURE && ++n % 6 === 0) await nextFrame(); }
      renderEnvCube(); rebuildEnv();
      probeSunVis();
      compMat.uniforms.uExposure.value = targetExposure;
      if (!CAPTURE) {
        // compile the scene's shaders off the main thread where the driver allows it
        try {
          renderer.setRenderTarget(sceneRT);
          await Promise.race([renderer.compileAsync(scene, camera), new Promise(r => setTimeout(r, 4000))]);
        } catch (err) { /* compiled lazily instead */ }
        renderer.setRenderTarget(null);
        if (adaptive) await fitTier();
        live = true;
        clock.getDelta();
        frame();
      } else {
        window.__frame = (dt, n = 1) => { for (let i = 0; i < n; i++) frame(dt); return true; };
        window.__setTime = (t) => { simTime = t; SUN_ELEV = sunElevation(t); refreshSky(); };
        window.__setPan = (a) => { autoPanAngle = a; };
        window.__view = (p, t) => { hasInteracted = true; camera.position.set(...p); controls.target.set(...t); };
        window.__setSun = (th) => { sunTheta = th; refreshSky(); };
        window.__setTier = (n) => { setTier(n); return TIER; };
        window.__ducks = ducks; window.__controls = controls;
        window.__spin = (n, dt = 1 / 60) => { for (let i = 0; i < n; i++) { simTime += dt; updateDucks(simTime, dt); stepRipples(dt); } };
        window.__dbg = { THREE, renderer, scene, camera, gpuName, lutRT, waterMat, cloudMat, skyDomeMat, compMat, sunDir, amb, sunE, refreshSky, eyeGeo, sunVis: () => sunVis, sceneRT: () => sceneRT, ripA: () => ripA,
          get tiles() { return tiles; }, get Q() { return Q; }, get TIER() { return TIER; }, get cubeRT() { return cubeRT; }, get ripOut() { return ripOut; }, get duckGeo() { return duckGeo; }, get duckGeoLo() { return duckGeoLo; } };
        window.__ready = true;
      }
    }
    boot();
  </script>
</body>
</html>
